distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# services.gradle.org and downloads.gradle.org only redirect to a GitHub
# release asset, and GitHub intermittently answers those downloads with 504,
# which kills a cold build before Gradle starts. This mirror serves the
# official archive directly; the pinned SHA-256 below is the sum published
# by Gradle (and mirrored as gradle-8.13-bin.zip.sha256), so a bad or altered
# mirror response is rejected before anything is unpacked.
distributionUrl=https\://repo.huaweicloud.com/gradle/gradle-8.13-bin.zip
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
networkTimeout=60000
validateDistributionUrl=true
