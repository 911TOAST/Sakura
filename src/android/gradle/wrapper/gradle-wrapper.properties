#Sun Feb 21 18:16:59 EST 2021
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Serve the distribution from Gradle's CDN directly. services.gradle.org is
# only a redirector to a GitHub release, and GitHub intermittently answers
# those object downloads with 504, which kills a cold CI build before Gradle
# even starts. downloads.gradle.org returns the zip itself.
distributionUrl=https\://downloads.gradle.org/distributions/gradle-8.13-bin.zip
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
networkTimeout=60000
validateDistributionUrl=true
